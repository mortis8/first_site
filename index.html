<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой сайт</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        p {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #5849c7;
        }

        #message {
            margin-top: 20px;
            color: #6c5ce7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Привет! 👋</h1>

        <p>Это мой первый одностраничный сайт.</p>

        <button onclick="hello()">Нажми меня</button>

        <div id="message"></div>
    </div>

    <script>
        function hello() {
            document.getElementById("message").textContent =
                "Добро пожаловать на мой сайт! 🚀";
        }
    </script>

</body>
</html>
