<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой сайт</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            color: #aaa;
            font-size: 18px;
        }

        .telegram {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;

            background: #229ED9;
            color: white;

            text-decoration: none;
            border-radius: 10px;

            font-size: 20px;
            font-weight: bold;
        }

        .telegram:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Привет! 👋</h1>

        <p>Добро пожаловать на мой сайт!</p>

        <a
            class="telegram"
            href="https://t.me/ТВОЙ_USERNAME"
            target="_blank"
        >
            ✈️ Мой Telegram
        </a>
    </div>

</body>
</html>
